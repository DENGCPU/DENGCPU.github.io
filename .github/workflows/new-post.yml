name: Publish a post from an issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: >
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      contains(github.event.issue.labels.*.name, '新文章')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the article
        id: post
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/new-post.mjs
      - name: Install and build
        timeout-minutes: 6
        run: |
          npm ci --no-audit --no-fund --registry https://registry.npmjs.org
          npm run build
      - name: Commit the article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts
          git commit -m "Add a post written from an issue."
          git push origin HEAD:master
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Close the issue
        if: success()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          POST_URL: ${{ steps.post.outputs.url }}
          POST_PATH: ${{ steps.post.outputs.path }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "已经写成 \`$POST_PATH\`。网站大约一分钟后更新：$POST_URL"
      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "这篇文章没有发布。请看本次 Actions 的失败记录。"
